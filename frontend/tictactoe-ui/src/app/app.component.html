<div class="game-container">
  <div class="game-layout">
    
    <!-- Left Column: Status, Board & Controls -->
    <div class="game-column">
      <div class="header-cell">
        <h2 *ngIf="isGameActive()">Current Player: {{ state?.currentPlayer }}</h2>
        <h2 *ngIf="isWon()" class="winner-text">Winner: {{ state?.winner }}!</h2>
        <h2 *ngIf="isDraw()" class="draw-text">Game Ended in a Draw!</h2>
      </div>

      <div class="board" *ngIf="state">
        <div class="board-row" *ngFor="let row of state.board; let r = index">
          <button
            *ngFor="let cell of row; let c = index"
            class="cell"
            [class.highlight]="isWinningCell(r, c)"
            [disabled]="!isGameActive() || cell !== ''"
            (click)="makeMove(r, c)"
          >
            {{ cell }}
          </button>
        </div>
      </div>

      <div class="controls">
        <button class="reset-btn" (click)="resetGame()">Reset Game</button>
        <button class="reset-btn" [disabled]="isUndoDisabled()" (click)="undo()">Undo Move</button>
      </div>
    </div>

    <!-- Right Column: Move History -->
    <div class="game-column history-column" *ngIf="state?.moveHistory && state!.moveHistory.length > 0">
      <div class="header-cell">
        <h2 class="history-title">Move History</h2>
      </div>

      <table class="history-table">
        <thead>
          <tr>
            <th>Move</th>
            <th>Player</th>
            <th>Position</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let move of state!.moveHistory; let i = index">
            <td>{{ i + 1 }}</td>
            <td><strong>{{ move.player }}</strong></td>
            <td>Row {{ move.row + 1 }}, Column {{ move.col + 1 }}</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>
</div>
